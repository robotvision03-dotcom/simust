<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMUST PLAY IT SMART · Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ----- SIMUST portal theme (matched to my_simust.html) ----- */
        :root {
            --ink: #f5f8fb;
            --muted: #a9b4c5;
            --navy: #06101f;
            --navy-2: #0a1930;
            --blue: #276ce5;
            --blue-soft: #7ca8f8;
            --gold: #d6b34b;
            --gold-light: #ead48f;
            --line: #ffffff24;
            --portal-panel: #0b192d;
            --bg-deep: #07111f;
            --bg-card: #0b192d;
            --bg-card-light: #0a1930;
            --green: #2ecc71;
            --yellow: #fbbf24;
            --red: #e74c3c;
            --white: #f5f8fb;
            --gray: #a9b4c5;
            --gray-dark: #8fa0b6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--navy); }
        body { background: var(--bg-deep); font-family: Arial, Helvetica, sans-serif; color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; -webkit-font-smoothing: antialiased; }
        .simust-card { background: var(--portal-panel); border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 20px 35px -12px rgba(0,0,0,0.55); max-width: 1400px; width: 100%; overflow: hidden; display: flex; flex-direction: column; min-height: 900px; }
        .simust-header { background: #050e1a; border-bottom: 1px solid var(--line); padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .simust-tabs { display: flex; gap: 1px; padding: 0 24px; border-bottom: 1px solid var(--line); overflow-x: auto; background: #050e1a; }
        .simust-body { flex: 1 1 auto; min-height: 720px; width: 100%; padding: 24px; background: var(--bg-deep); }
        .simust-footer { text-align: center; font-size: 10px; color: #647185; letter-spacing: 0.08em; border-top: 1px solid var(--line); padding: 16px; background: #040b14; }
        .gold-accent { color: var(--gold); }
        .stat-number { font-size: 2.4rem; font-weight: 800; color: var(--gold-light); }
        .panel { background: var(--portal-panel); border-radius: 8px; border: 1px solid var(--line); }
        .btn-primary { background: linear-gradient(105deg, var(--gold), #d6b34b); color: #07111f; font-weight: 800; padding: 10px 24px; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { transform: scale(1.01); box-shadow: 0 0 24px rgba(214,179,75,0.25); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-realtime { background: linear-gradient(105deg, #2ecc71, #1ea55a); color: #07111f; }
        .btn-realtime:disabled { background: #1a2d4a; color: #8fa0b6; }
        .btn-danger { background: var(--red); color: white; }
        .btn-results { background: linear-gradient(105deg, var(--blue), #1d5bc4); color: white; }
        .btn-logout { background: transparent; color: #a8c6ff; border: 1px solid var(--line); padding: 8px 16px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-logout:hover { background: #ffffff0a; color: var(--ink); }
        .live-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-inline-end: 8px; animation: pulse 1.5s infinite; }
        .live-dot.active { background: var(--green); }
        .live-dot.inactive { background: #647185; animation: none; }
        @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }
        .tab-button { background: transparent; color: #8190a5; border: none; border-bottom: 2px solid transparent; padding: 14px 22px; font-weight: 800; cursor: pointer; transition: all 0.2s; font-size: 13px; letter-spacing: 0.04em; }
        .tab-button.active { color: #fff; border-bottom-color: var(--gold); background: #276ce51a; }
        .tab-button:hover { color: #dce7f5; background: #276ce50d; }
        .player-card { background: var(--portal-panel); border-radius: 8px; border: 1px solid var(--line); padding: 12px 18px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .player-card:hover { border-color: var(--gold); background: #10243f; }
        .player-card.active { border-color: var(--gold); background: #10243f; }
        .search-input { background: #07111f; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; color: #fff; outline: none; width: 100%; transition: border-color 0.2s; }
        .search-input:focus { border-color: var(--gold); }
        .toggle-switch { position: relative; display: inline-block; width: 56px; height: 28px; margin: 0 10px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #1a2d4a; border-radius: 34px; transition: 0.3s; }
        .slider::before { content: ''; position: absolute; height: 22px; width: 22px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
        input:checked + .slider { background: var(--green); }
        input:checked + .slider::before { transform: translateX(28px); }
        .viz-status-on { color: var(--green); font-weight: bold; }
        .viz-status-off { color: var(--red); font-weight: bold; }
        .toast { position: fixed; bottom: 24px; inset-inline-end: 24px; background: var(--portal-panel); border-inline-start: 4px solid var(--gold); padding: 14px 24px; border-radius: 8px; z-index: 1100; box-shadow: 0 10px 40px rgba(0,0,0,0.6); animation: slideIn 0.3s ease; border: 1px solid var(--line); color: var(--ink); }
        @keyframes slideIn { from { transform: translateX(100%); opacity:0; } to { transform: translateX(0); opacity:1; } }
        .loading-spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--gold); border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .clear-selection-btn { background: #1a2d4a; color: var(--red); border: 1px solid var(--line); padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 700; transition: 0.2s; }
        .clear-selection-btn:hover { background: #2a3d5a; }
        .refresh-btn { background: #07111f; padding: 6px 14px; border-radius: 6px; font-size: 11px; cursor: pointer; border: 1px solid var(--line); color: #dce7f5; font-weight: 700; transition: 0.2s; }
        .refresh-btn:hover { border-color: var(--gold); color: var(--gold-light); }
        .auto-badge { background: var(--green); color: #07111f; border-radius: 6px; padding: 2px 8px; font-size: 10px; font-weight: 800; margin-inline-start: 8px; animation: pulse 1s infinite; }
        .metric-ring { background: var(--portal-panel); border-radius: 8px; border: 1px solid var(--line); padding: 14px 10px 10px 10px; text-align: center; transition: background 0.15s; display: flex; flex-direction: column; align-items: center; }
        .metric-ring:hover { background: #10243f; }
        .metric-ring .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #9ca3af; margin-bottom: 4px; font-weight: 700; }
        .metric-ring .value { font-size: 22px; font-weight: 800; }
        .metric-ring .sub { font-size: 11px; color: #8090a5; }
        .ring-chart-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .ring-chart-wrapper canvas { max-height: 110px; max-width: 110px; margin: 0 auto; display: block; }
        .table-wrap { overflow-x: auto; margin-top: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--portal-panel); }
        .table-wrap table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 780px; }
        .table-wrap th { background: #050e1a; color: var(--gold); text-transform: uppercase; font-size: 9px; letter-spacing: 0.4px; padding: 10px 8px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
        .table-wrap td { padding: 7px 8px; border-bottom: 1px solid var(--line); color: #dce7f7; white-space: nowrap; }
        .table-wrap tr:hover td { background: #10243f; }
        .table-wrap .result-badge { display: inline-block; padding: 2px 10px; border-radius: 6px; font-weight: 600; font-size: 10px; }
        .result-badge.correct { background: rgba(46,204,113,0.2); color: var(--green); }
        .result-badge.late { background: rgba(251,191,36,0.2); color: var(--yellow); }
        .result-badge.wrong { background: rgba(231,76,60,0.2); color: var(--red); }
        .result-badge.miss { background: rgba(39,108,229,0.2); color: var(--blue-soft); }
        .fac-badge { display: inline-block; padding: 2px 10px; border-radius: 6px; font-weight: 700; font-size: 10px; background: rgba(214,179,75,0.15); color: var(--gold); border: 1px solid rgba(214,179,75,0.25); }
        .fac-badge.right { background: rgba(231,76,60,0.2); color: #e74c3c; border-color: rgba(231,76,60,0.3); }
        .fac-badge.left { background: rgba(39,108,229,0.2); color: var(--blue-soft); border-color: rgba(39,108,229,0.3); }
        .hamburger-menu { position: relative; display: inline-block; }
        .hamburger-btn { background: transparent; border: none; color: var(--gold); font-size: 28px; cursor: pointer; padding: 4px 12px; border-radius: 6px; transition: 0.2s; }
        .hamburger-btn:hover { background: rgba(214,179,75,0.12); }
        .dropdown-menu { position: absolute; top: 40px; inset-inline-start: 0; background: var(--portal-panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 0; min-width: 180px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); z-index: 200; display: none; }
        .dropdown-menu.open { display: block; }
        .dropdown-menu button { display: block; width: 100%; text-align: start; padding: 10px 20px; background: transparent; border: none; color: #dce7f5; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .dropdown-menu button:hover { background: #276ce51a; color: var(--gold); }
        .player-profile { background: var(--portal-panel); border-radius: 8px; border: 1px solid var(--line); padding: 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; transition: 0.2s; cursor: pointer; }
        .player-profile:hover { background: #10243f; }
        .player-avatar { width: 100px; height: 100px; border-radius: 50%; background: #1a2d4a; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; color: var(--gold); flex-shrink: 0; overflow: hidden; }
        .player-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .player-info h2 { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .player-info .player-id { font-size: 14px; color: var(--gray-dark); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin-bottom: 8px; }
        .player-info .player-details { display: flex; flex-wrap: wrap; gap: 16px 24px; font-size: 14px; }
        .player-info .player-details span { color: var(--muted); }
        .player-info .player-details strong { color: #fff; font-weight: 600; }
        .player-info .player-details .label { color: var(--gray-dark); margin-inline-end: 4px; }
        .score-badge { display: inline-block; padding: 2px 12px; border-radius: 6px; font-weight: bold; font-size: 13px; }
        .score-high { background: rgba(46,204,113,0.2); color: var(--green); border: 1px solid rgba(46,204,113,0.3); }
        .score-mid { background: rgba(251,191,36,0.2); color: var(--yellow); border: 1px solid rgba(251,191,36,0.3); }
        .score-low { background: rgba(231,76,60,0.2); color: var(--red); border: 1px solid rgba(231,76,60,0.3); }
        .level-progress { background: var(--portal-panel); border-radius: 8px; padding: 12px 16px; border: 1px solid var(--line); margin: 8px 0; }
        .level-progress .level-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; max-height: 320px; overflow-y: auto; padding: 4px 2px; }
        .level-progress .level-bar::-webkit-scrollbar { width: 4px; }
        .level-progress .level-bar::-webkit-scrollbar-track { background: var(--bg-deep); border-radius: 2px; }
        .level-progress .level-bar::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }
        .level-progress .level-item { display: flex; flex-direction: row; align-items: center; gap: 6px; background: #1a2d4a; padding: 3px 10px; border-radius: 6px; font-size: 11px; color: #8fa0b6; border: 1px solid transparent; transition: all 0.2s; white-space: nowrap; position: relative; }
        .level-progress .level-item.unlocked { background: rgba(46,204,113,0.18); color: var(--green); border-color: rgba(46,204,113,0.45); font-weight: 600; }
        .level-progress .level-item.completed { background: rgba(46,204,113,0.22); color: var(--green); border-color: rgba(46,204,113,0.45); }
        .level-progress .level-item.current { background: rgba(214,179,75,0.15); color: var(--gold); border-color: rgba(214,179,75,0.4); font-weight: bold; }
        .level-progress .level-item.locked { opacity: 0.55; cursor: not-allowed; background: #07111f; border-color: var(--line); color: #8fa0b6; font-weight: 400; }
        .level-progress .level-item .level-label { font-size: 10px; font-weight: 500; flex: 1 1 auto; min-width: 0; overflow: visible; line-height: 1.3; }
        .level-progress .level-item .level-badge { font-size: 12px; flex: 0 0 auto; position: static; display: inline-flex; align-items: center; }
        .level-progress .level-category { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 0; border-bottom: 1px solid var(--line); margin-bottom: 4px; width: 100%; }
        .level-progress .level-category .cat-label { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 0.5px; text-transform: uppercase; min-width: 80px; opacity: 0.7; }
        .level-progress .level-category .cat-items { display: flex; flex-wrap: wrap; gap: 4px; }
        .level-progress .level-summary { font-size: 10px; color: var(--gray-dark); margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
        .unlock-btn, .lock-btn { background: transparent; border: none; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 6px; transition: 0.2s; }
        .unlock-btn { color: var(--green); background: rgba(46,204,113,0.2); border: 1px solid rgba(46,204,113,0.5); }
        .unlock-btn:hover { background: rgba(46,204,113,0.35); transform: scale(1.1); }
        .lock-btn { color: var(--red); }
        .lock-btn:hover { background: rgba(231,76,60,0.15); transform: scale(1.1); }
        .btn-unlock { background: linear-gradient(105deg, #2ecc71, #1ea55a); color: #07111f; font-weight: 800; padding: 10px 24px; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-unlock:hover { transform: scale(1.01); box-shadow: 0 0 20px rgba(46,204,113,0.35); }
        .btn-unlock:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; background: #1a2d4a; color: #8fa0b6; }
        .login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #07111f; display: flex; align-items: center; justify-content: center; z-index: 2000; overflow-y: auto; padding: 28px 16px; }
        .lang-dropdown { position: relative; display: inline-block; }
        .lang-dropdown-toggle { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: #07111f; border: 1px solid var(--line); border-radius: 8px; color: var(--gold); cursor: pointer; padding: 0; }
        .lang-dropdown-toggle:hover, .lang-dropdown.open .lang-dropdown-toggle { border-color: var(--gold); background: rgba(214,179,75,0.12); }
        .lang-dropdown-menu { display: none; position: absolute; top: calc(100% + 6px); inset-inline-end: 0; min-width: 168px; margin: 0; padding: 6px 0; list-style: none; background: var(--portal-panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); z-index: 2100; }
        .lang-dropdown.open .lang-dropdown-menu { display: block; }
        .lang-dropdown-menu button { display: block; width: 100%; text-align: start; background: transparent; border: none; color: #dce7f5; font-size: 13px; font-weight: 700; padding: 9px 16px; cursor: pointer; }
        .lang-dropdown-menu button:hover, .lang-dropdown-menu button.active { background: #276ce51a; color: var(--gold); }
        .login-lang-switcher { position: absolute; top: 20px; inset-inline-end: 24px; }
        .login-layout { display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch; justify-content: center; width: 100%; max-width: 920px; }
        .login-box { background: var(--navy-2); border-radius: 12px; border: 1px solid var(--line); padding: 40px 32px; max-width: 420px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.45); }
        .login-box h1 { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 8px; letter-spacing: -0.03em; }
        .login-box .subtitle { text-align: center; color: #8fa0b6; font-size: 14px; margin-bottom: 28px; }
        .today-schedule-panel { background: var(--navy-2); border-radius: 12px; border: 1px solid var(--line); padding: 28px 24px; max-width: 360px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.45); display: flex; flex-direction: column; min-height: 280px; }
        .today-schedule-panel .kicker { color: var(--gold); font-size: 10px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 8px; }
        .today-schedule-panel h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px; }
        .today-schedule-panel .sub { color: #8fa0b6; font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
        .today-schedule-list { display: flex; flex-direction: column; gap: 8px; }
        .today-schedule-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; background: #07111f; border: 1px solid var(--line); border-radius: 8px; }
        .today-schedule-row .who { font-weight: 700; color: #dce7f5; font-size: 13px; }
        .today-schedule-row .when { color: var(--gold); font-size: 12px; font-weight: 800; white-space: nowrap; }
        .today-schedule-empty { color: #8fa0b6; font-size: 13px; font-style: italic; padding: 12px 0; }
        .login-input { background: #07111f; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; color: #fff; outline: none; width: 100%; transition: border-color 0.2s; font-size: 15px; margin-bottom: 16px; }
        .login-input:focus { border-color: var(--gold); }
        .login-input::placeholder { color: #647185; }
        .login-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 800; border-radius: 6px; border: none; background: linear-gradient(105deg, var(--gold), #d6b34b); color: #07111f; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .login-btn:hover { transform: scale(1.01); box-shadow: 0 0 30px rgba(214,179,75,0.25); }
        .login-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; }
        .login-footer { text-align: center; margin-top: 24px; font-size: 12px; color: #647185; letter-spacing: 0.08em; }
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(5,14,26,0.82); display:flex; align-items:center; justify-content:center; z-index:3000; }
        .modal-box { background: var(--navy-2); border-radius: 12px; border:1px solid var(--line); padding: 32px; max-width: 600px; width:90%; max-height:90vh; overflow-y:auto; box-shadow: 0 20px 40px rgba(0,0,0,0.55); }
        .modal-box h2 { font-size:24px; font-weight:800; color:var(--gold); margin-bottom:16px; }
        .modal-box .form-group { margin-bottom:12px; }
        .modal-box .form-group label { display:block; font-size:12px; color:var(--gray-dark); margin-bottom:4px; font-weight: 700; letter-spacing: 0.04em; }
        .modal-box .form-group input { width:100%; background:#07111f; border:1px solid var(--line); border-radius:6px; padding:10px 14px; color:#fff; outline:none; font-size:14px; }
        .modal-box .form-group input:focus { border-color:var(--gold); }
        .modal-box .btn-row { display:flex; gap:12px; justify-content:end; margin-top:20px; }
        .modal-box .btn-row button { padding:8px 20px; border-radius:6px; border:none; font-weight:800; cursor:pointer; }
        .modal-box .btn-row .save-btn { background:var(--green); color:#07111f; }
        .modal-box .btn-row .cancel-btn { background:transparent; color:#a8c6ff; border: 1px solid var(--line); }
        .modal-box .btn-row .delete-btn { background:var(--red); color:white; }
        @media (max-width:900px) {
            body { padding: 0; align-items: stretch; justify-content: flex-start; }
            .simust-card { min-height: 100dvh; border-radius: 0; max-width: none; }
        }
        @media (max-width:768px) { .simust-card, .simust-body { min-height: 0; } .simust-header { padding:14px 16px; } .tab-button { padding:8px 16px; font-size:12px; } .stat-number { font-size:1.6rem; } .player-card { padding:8px 12px; font-size:13px; } .metric-ring .value { font-size:18px; } .table-wrap table { font-size:9px; min-width:680px; } .hamburger-btn { font-size:24px; } .player-profile { flex-direction:column; align-items:center; text-align:center; } .player-info .player-details { justify-content:center; } .login-box { padding:32px 24px; } .level-progress .level-item { font-size:10px; padding:2px 8px; } .level-progress .level-category .cat-label { font-size:9px; min-width:60px; } }
        @media (max-width:480px) { .result-row { grid-template-columns:35px 35px 45px 45px 45px 45px 40px 35px 40px; font-size:8px; gap:1px; padding:3px 4px; } .chart-container canvas { min-width:400px; height:160px; } .player-avatar { width:80px; height:80px; font-size:32px; } .login-box { padding:24px 16px; } .level-progress .level-item { font-size:9px; padding:2px 6px; } .level-progress .level-category .cat-label { font-size:8px; min-width:50px; } }

        .num-ltr,
        .metric-ring .value,
        .stat-number,
        .player-info .player-id,
        .today-schedule-row .when,
        .ring-chart-wrapper,
        .table-wrap td {
            unicode-bidi: isolate;
        }
        .num-ltr,
        .metric-ring .value,
        .stat-number,
        .player-info .player-id,
        .today-schedule-row .when,
        .ring-chart-wrapper {
            direction: ltr;
        }
        .toggle-switch { direction: ltr; }

            var handleUnlockLevel = function(levelId) {
                if (!selectedPlayerId) { showToast("No player selected", 'error'); return; }
                if (!isAdmin) { showToast("Only admin can unlock levels", 'error'); return; }
                axios.post("/unlock-level", { player_id: selectedPlayerId, level_id: levelId }).then(function(res) {
                    if (res.data.status === "success") {
                        showToast("Level " + levelId + " unlocked!", 'success');
                        // Immediate local update
                        var updatedPlayers = players.map(function(p) {
                            if (p.id === selectedPlayerId) {

                                if (progress.unlocked_levels.indexOf(levelId) === -1) {
                                    progress.unlocked_levels.push(levelId);
                                    // Update current to highest unlocked not completed
                                    var sorted = sortLevels(allLevels);
                                    var highest = null;
                                    for (var i = sorted.length - 1; i >= 0; i--) {
                                        if (progress.unlocked_levels.indexOf(sorted[i].id) !== -1 &&
                                            progress.completed_levels.indexOf(sorted[i].id) === -1) {
                                            highest = sorted[i].id;
                                            break;
                                        }
                                    }
                                    if (highest) progress.current_level = highest;
                                }
                                return Object.assign({}, p, { progress: progress });
                            }
                            return p;
                        });
                        setPlayers(updatedPlayers);
                        var updatedPlayer = updatedPlayers.find(function(p) { return p.id === selectedPlayerId; });
                        if (updatedPlayer) updateProgressForPlayer(updatedPlayer);
                        // Background sync
                        loadPlayers();
                    } else {
                        showToast(res.data.message || "Unlock failed", 'error');

            // ----- Auto-unlock based on performance (with subdirectory check) -----
            var checkAndUnlockNextLevel = function(stats, currentLevelId, subdirectory) {
                if (!selectedPlayerId) return;
                if (!currentLevelId) return;
                // Compute AE and ACC from stats
                var total = stats.total || 0;
                if (total === 0) return;
                var correct = stats.correct || 0;
                var late = stats.late || 0;
                var acc = ((correct + late) / total) * 100;
                var ae = stats.avg_ae || 0;

                var thresholdAE = 70;
                var thresholdACC = 70;

                // Check if performance is good
                if (ae >= thresholdAE && acc >= thresholdACC) {
                    // For Foundation level, only unlock if subdirectory is SF-180N
                    var isFoundation = currentLevelId.toLowerCase().indexOf('foundation') !== -1 || currentLevelId === 'L00-Foundation';
                    if (isFoundation) {
                        if (subdirectory !== 'SF-180N') {
                            showToast("Performance good, but Entry level unlocks only after completing SF-180N.", 'info');
                            return;
                        }
                    }
                    // Find next level
                    var nextLevelId = getNextLevelId(currentLevelId, allLevels);
                    if (!nextLevelId) {
                        showToast("You have completed all levels! Excellent performance!", 'success');
                        return;
                    }
                    // Check if already unlocked
                    if (unlockedLevels.indexOf(nextLevelId) !== -1) {
                        showToast("Performance passed, but " + nextLevelId + " is already unlocked.", 'info');
                        return;

                    // Unlock next level
                    axios.post("/unlock-level", { player_id: selectedPlayerId, level_id: nextLevelId }).then(function(res) {
                        if (res.data.status === "success") {
                            showToast("🏆 Great performance! Unlocked: " + nextLevelId, 'success');

                            });
                        } else {
                            showToast("Unlock failed: " + (res.data.message || 'unknown error'), 'error');
                        }
                    }).catch(function(e) {
                        console.error("Auto-unlock error:", e);
                        showToast("Auto-unlock error: " + (e.response ? e.response.data.detail : e.message), 'error');
                    });
                } else {
                    showToast("Performance: AE=" + ae.toFixed(1) + "%, ACC=" + acc.toFixed(1) + "%. Need ≥70% both to unlock next level.", 'info');
                }
            };
