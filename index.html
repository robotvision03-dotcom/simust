<body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/static/i18n.js"></script>

    <script>
        // Replace all optional chaining (?.) with safe checks to avoid syntax errors
        const { useState, useEffect, useRef } = React;

        // Helper functions (unchanged)
        const parseScreens = function(screens) {
            if (!screens) return [];
            if (Array.isArray(screens)) return screens;
            if (typeof screens === 'string') {
                return screens.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s !== ''; });
            }
            return [];
        };

        var getVideoIndexFromId = function(id) {
            if (!id) return null;
            var match = id.match(/S(\d+)/i);
            if (match) {
                var num = parseInt(match[1], 10);
                return Math.floor((num - 1) / 4) + 1;
            }
            return null;
        };

        var sanitizeDisplay = function(val) {
            if (val === undefined || val === null || val === 'N/A' || val === '') return '–';
            return val;
        };

        // Category order and sorting
        var CATEGORY_ORDER = {
            'Foundation': 0,
            'Entry': 1,
            'Activated': 2,
            'High Performance': 3,
            'Elite': 4,
            'World Class': 5
        };

        var getCategoryFromId = function(id) {
            if (!id) return 'Other';
            if (id.indexOf('Foundation') !== -1) return 'Foundation';
            if (id.indexOf('Entry') !== -1) return 'Entry';
            if (id.indexOf('Activated') !== -1) return 'Activated';
            if (id.indexOf('High Performance') !== -1) return 'High Performance';
            if (id.indexOf('Elite') !== -1) return 'Elite';
            if (id.indexOf('World Class') !== -1) return 'World Class';
            return 'Other';
        };

        var getTNumber = function(id) {
            if (!id) return 0;
            var match = id.match(/T(\d+)/i);
            if (match) return parseInt(match[1], 10);
            return 0;
        };

        var getCNumber = function(id) {
            if (!id) return 0;
            var match = id.match(/C(\d+)/i);
            if (match) return parseInt(match[1], 10);
            return 0;
        };

        var sortLevels = function(levels) {
            if (!levels || levels.length === 0) return [];
            return levels.slice().sort(function(a, b) {
                var catA = getCategoryFromId(a.id);
                var catB = getCategoryFromId(b.id);
                var orderA = CATEGORY_ORDER[catA] !== undefined ? CATEGORY_ORDER[catA] : 999;
                var orderB = CATEGORY_ORDER[catB] !== undefined ? CATEGORY_ORDER[catB] : 999;
                if (orderA !== orderB) return orderA - orderB;
                var tA = getTNumber(a.id);
                var tB = getTNumber(b.id);
                if (tA !== tB) return tA - tB;
                var cA = getCNumber(a.id);
                var cB = getCNumber(b.id);
                return cA - cB;
            });
        };

        var getHighestUnlockedLevel = function(levels, unlocked) {
            if (!levels || levels.length === 0) return null;
            var sorted = sortLevels(levels);
            for (var i = sorted.length - 1; i >= 0; i--) {
                if (unlocked.indexOf(sorted[i].id) !== -1) {
                    return sorted[i].id;
                }
            }
            return sorted[0] ? sorted[0].id : null;
        };

        // Get next level ID based on sorted order
        var getNextLevelId = function(currentLevelId, allLevels) {
            if (!currentLevelId || !allLevels || allLevels.length === 0) return null;
            var sorted = sortLevels(allLevels);
            for (var i = 0; i < sorted.length; i++) {
                if (sorted[i].id === currentLevelId) {
                    if (i + 1 < sorted.length) {

                        if (stored) {
                            try { localPlayers = JSON.parse(stored); } catch (e) {}
                        }
                        var existingIds = {};
                        backendPlayers.forEach(function(p) { existingIds[p.id] = true; });
                        var merged = backendPlayers.slice();
                        localPlayers.forEach(function(lp) {
                            if (!existingIds[lp.id]) {
                                merged.push(lp);
                            }
                        });
                        setPlayers(merged);
                        localStorage.setItem("simust_players", JSON.stringify(merged));
                        if (merged.length > 0) {
                            if (!selectedPlayerId) {
                                setSelectedPlayerId(merged[0].id);
                                updateProgressForPlayer(merged[0]);
                            } else {
                                var player = merged.find(function(p) { return p.id === selectedPlayerId; });
                                if (player) updateProgressForPlayer(player);
                            }
                        }
                        return;
                    }
                }).catch(function(e) {
                    console.warn("Could not fetch players from server, using localStorage fallback.", e);
                    // Fallback
                    try {
                        var stored2 = localStorage.getItem("simust_players");
                        if (stored2) {
                            var parsed = JSON.parse(stored2);
                            var updated = parsed.map(function(p) {
                                return Object.assign({}, p, {
                                    club: p.club || '',
                                    birthday: p.birthday || '',
                                    age: p.age || '',
                                    image: p.image || null,
                                    simustScore: p.simustScore || 0,
                                    sessions: p.sessions || [],
                                    progress: p.progress || { current_level: "L00-Foundation",
                                        unlocked_levels: ["L00-Foundation"], completed_levels: [] }
                                });
                            });
                            setPlayers(updated);
                            localStorage.setItem("simust_players", JSON.stringify(updated));
                            if (updated.length > 0 && !selectedPlayerId) {
                                setSelectedPlayerId(updated[0].id);
                                updateProgressForPlayer(updated[0]);
                            } else if (selectedPlayerId) {
                                var p2 = updated.find(function(p) { return p.id === selectedPlayerId; });

            var updateProgressForPlayer = function(player) {
                if (!player) return;
                var progress = player.progress || {};
                var unlocked = progress.unlocked_levels || ["L00-Foundation"];
                var completed = progress.completed_levels || [];
                var current = progress.current_level || "L00-Foundation";
                setUnlockedLevels(unlocked);
                setCompletedLevels(completed);
                setCurrentLevel(current);
                // Set selected level to the highest unlocked level
                var highest = getHighestUnlockedLevel(allLevels, unlocked);
                if (highest) {
                    setSelectedLevel(highest);
                } else if (current && unlocked.indexOf(current) !== -1) {
                    setSelectedLevel(current);
                } else if (unlocked.length > 0) {
                    setSelectedLevel(unlocked[0]);
                }
                // Reset subdirectory selection when level changes
                setSelectedSubdirectory("");
            };

            // ----- UNLOCK / LOCK LEVEL (FIXED: immediate UI update) -----
            var handleUnlockLevel = function(levelId) {
                if (!selectedPlayerId) { showToast("No player selected", 'error'); return; }
                if (!isAdmin) { showToast("Only admin can unlock levels", 'error'); return; }
                axios.post("/unlock-level", { player_id: selectedPlayerId, level_id: levelId }).then(function(res) {
                    if (res.data.status === "success") {
                        showToast("Level " + levelId + " unlocked!", 'success');
                        // Immediate local update
                        var updatedPlayers = players.map(function(p) {
                            if (p.id === selectedPlayerId) {
                                var progress = p.progress || { current_level: "L00-Foundation",
                                    unlocked_levels: ["L00-Foundation"], completed_levels: [] };
                                if (progress.unlocked_levels.indexOf(levelId) === -1) {
                                    progress.unlocked_levels.push(levelId);
                                    // Update current to highest unlocked not completed
                                    var sorted = sortLevels(allLevels);
                                    var highest = null;
                                    for (var i = sorted.length - 1; i >= 0; i--) {
                                        if (progress.unlocked_levels.indexOf(sorted[i].id) !== -1 &&
                                            progress.completed_levels.indexOf(sorted[i].id) === -1) {
                                            highest = sorted[i].id;
                                            break;
                                        }
                                    }
                                    if (highest) progress.current_level = highest;
                                }
                                return Object.assign({}, p, { progress: progress });
                            }
                            return p;
                        });
                        setPlayers(updatedPlayers);
                        var updatedPlayer = updatedPlayers.find(function(p) { return p.id === selectedPlayerId; });
                        if (updatedPlayer) updateProgressForPlayer(updatedPlayer);
                        // Background sync
                        loadPlayers();
                    } else {
                        showToast(res.data.message || "Unlock failed", 'error');
                    }
                }).catch(function(e) {
                    console.error(e);
                    showToast("Unlock error: " + (e.response ? e.response.data.detail : e.message), 'error');
                });
            };

            var handleLockLevel = function(levelId) {
                if (!selectedPlayerId) { showToast("No player selected", 'error'); return; }
                if (!isAdmin) { showToast("Only admin can lock levels", 'error'); return; }
                if (levelId === "L00-Foundation") {
                    showToast("Foundation cannot be locked", 'error');
                    return;
                }
                axios.post("/lock-level", { player_id: selectedPlayerId, level_id: levelId }).then(function(res) {
                    if (res.data.status === "success") {
                        showToast("Level " + levelId + " locked!", 'info');
                        // Immediate local update
                        var updatedPlayers = players.map(function(p) {
                            if (p.id === selectedPlayerId) {
                                var progress = p.progress || { current_level: "L00-Foundation",
                                    unlocked_levels: ["L00-Foundation"], completed_levels: [] };
                                progress.unlocked_levels = progress.unlocked_levels.filter(function(id) { return id !== levelId; });
                                progress.completed_levels = progress.completed_levels.filter(function(id) { return id !== levelId; });
                                if (progress.unlocked_levels.indexOf("L00-Foundation") === -1) {
                                    progress.unlocked_levels.unshift("L00-Foundation");
                                }
                                if (progress.current_level === levelId) {
                                    progress.current_level = "L00-Foundation";
                                    var sorted = sortLevels(allLevels);
                                    var highest = null;
                                    for (var i = sorted.length - 1; i >= 0; i--) {
                                        if (progress.unlocked_levels.indexOf(sorted[i].id) !== -1 &&
                                            progress.completed_levels.indexOf(sorted[i].id) === -1) {
                                            highest = sorted[i].id;
                                            break;
                                        }
                                    }
                                    if (highest) progress.current_level = highest;
                                }
                                return Object.assign({}, p, { progress: progress });
                            }
                            return p;
                        });
                        setPlayers(updatedPlayers);
                        var updatedPlayer = updatedPlayers.find(function(p) { return p.id === selectedPlayerId; });
                        if (updatedPlayer) updateProgressForPlayer(updatedPlayer);
                        // Background sync
                        loadPlayers();
                    } else {
                        showToast(res.data.message || "Lock failed", 'error');

            // ----- FETCH RESULTS -----
            var fetchRealtimeResults = function(showLoading) {
                if (showLoading === undefined) showLoading = true;
                if (showLoading) setLoadingAnalysis(true);
                return axios.get("/realtime-results").then(function(res) {
                    if (res.data && res.data.status === "success" && res.data.report) {
                        var report = res.data.report;
                        var actions = report.actions || [];
                        var statsFromBackend = report.statistics || {};

                        var formatted = actions.map(function(a, idx) {
                            var sessionDur = (a.session_duration !== undefined && a.session_duration !==
                                null && a.session_duration !== 'N/A' && a.session_duration !== '-') ?
                                parseFloat(a.session_duration) : null;
                            var ae = (a.ae !== undefined && a.ae !== null && a.ae !== 'N/A') ? parseFloat(a
                                .ae) : null;
                            var videoIndex = a.video_index || a.videoIndex;
                            if (videoIndex === undefined || videoIndex === null) {
                                var fromId = getVideoIndexFromId(a.id);
                                videoIndex = fromId || Math.floor(idx / 4) + 1;
                            }
                            return {
                                id: a.id || a.block_id || '',
                                action: a.action || '',
                                screens: Array.isArray(a.screens) ? a.screens.join(', ') : a.screens ||
                                    '',
                                result: a.result || 'N/A',
                                winning_screen: a.winning_screen || 'N/A',
                                session_duration: sessionDur,
                                movement: a.movement || 0,
                                direction: a.direction || 'NONE',
                                aep: a.aep || 'N/A',
                                ae: ae,
                                video_index: videoIndex,
                                videoIndex: videoIndex
                            };
                        });

                        var stats = {
                            correct: statsFromBackend.correct || formatted.filter(function(a) { return a
                                    .result === 'Correct'; }).length,
                            late: statsFromBackend.late || formatted.filter(function(a) { return a.result ===
                                    'Late'; }).length,
                            wrong: statsFromBackend.wrong || formatted.filter(function(a) { return a.result ===
                                    'Wrong'; }).length,
                            miss: statsFromBackend.miss || formatted.filter(function(a) { return a.result ===
                                    'Miss'; }).length,
                            total: statsFromBackend.total || formatted.length,
                            avg_finishing_time: statsFromBackend.avg_finishing_time || 0,
                            total_distance: statsFromBackend.total_distance || 0,
                            goals_by_screen: statsFromBackend.goals_by_screen || {},
                            avg_ae: statsFromBackend.avg_ae || 0
                        };

                        if (stats.avg_finishing_time === 0) {
                            var correctTimes = formatted.filter(function(a) {
                                return a.result === 'Correct' && a.time_of_min !== null && a
                                    .time_of_min > 0;
                            }).map(function(a) { return a.time_of_min; });
                            if (correctTimes.length > 0) {
                                stats.avg_finishing_time = correctTimes.reduce(function(s, v) { return s +
                                        v; }, 0) / correctTimes.length;
                            }
                        }

                        if (Object.keys(stats.goals_by_screen).length === 0) {
                            formatted.filter(function(a) {
                                return a.result === 'Correct' && a.winning_screen && a
                                    .winning_screen !== 'N/A';
                            }).forEach(function(a) {
                                var screen = a.winning_screen;
                                stats.goals_by_screen[screen] = (stats.goals_by_screen[screen] || 0) +
                                    1;
                            });
                        }

                        setAnalysisResults(formatted);
                        setReportData(Object.assign({}, report, {
                            actions: formatted,
                            statistics: stats,
                            total_actions: formatted.length,
                            goals_by_screen: stats.goals_by_screen,
                            directory: res.data.directory
                        }));
                        setCurrentDirectory(res.data.directory);
                        setLastUpdateTime(new Date().toLocaleTimeString());
                        if (showLoading) setLoadingAnalysis(false);
                        return true;
                    }
                    if (showLoading) setLoadingAnalysis(false);
                    return false;
                }).catch(function(e) {
                    console.error("fetchRealtimeResults error:", e);
                    if (showLoading) setLoadingAnalysis(false);
                    return false;
                });
            };

            // ----- Auto-unlock based on performance (with subdirectory check) -----
            var checkAndUnlockNextLevel = function(stats, currentLevelId, subdirectory) {
                if (!selectedPlayerId) return;
                if (!currentLevelId) return;
                // Compute AE and ACC from stats
                var total = stats.total || 0;
                if (total === 0) return;
                var correct = stats.correct || 0;
                var late = stats.late || 0;
                var acc = ((correct + late) / total) * 100;
                var ae = stats.avg_ae || 0;

                var thresholdAE = 70;
                var thresholdACC = 70;

                // Check if performance is good
                if (ae >= thresholdAE && acc >= thresholdACC) {
                    // For Foundation level, only unlock if subdirectory is SF-180N
                    var isFoundation = currentLevelId.toLowerCase().indexOf('foundation') !== -1 || currentLevelId === 'L00-Foundation';
                    if (isFoundation) {
                        if (subdirectory !== 'SF-180N') {
                            showToast("Performance good, but Entry level unlocks only after completing SF-180N.", 'info');
                            return;
                        }
                    }
                    // Find next level
                    var nextLevelId = getNextLevelId(currentLevelId, allLevels);
                    if (!nextLevelId) {
                        showToast("You have completed all levels! Excellent performance!", 'success');
                        return;
                    }
                    // Check if already unlocked
                    if (unlockedLevels.indexOf(nextLevelId) !== -1) {
                        showToast("Performance passed, but " + nextLevelId + " is already unlocked.", 'info');
                        return;
                    }
                    // Unlock next level
                    axios.post("/unlock-level", { player_id: selectedPlayerId, level_id: nextLevelId }).then(function(res) {
                        if (res.data.status === "success") {
                            showToast("🏆 Great performance! Unlocked: " + nextLevelId, 'success');
                            // Update local state
                            setUnlockedLevels(unlockedLevels.concat([nextLevelId]));
                            // Reload player progress
                            loadPlayers().then(function() {
                                var player = getSelectedPlayer();
                                if (player) updateProgressForPlayer(player);
                            });
                        } else {
                            showToast("Unlock failed: " + (res.data.message || 'unknown error'), 'error');
                        }
                    }).catch(function(e) {
                        console.error("Auto-unlock error:", e);
                        showToast("Auto-unlock error: " + (e.response ? e.response.data.detail : e.message), 'error');
                    });
                } else {
                    showToast("Performance: AE=" + ae.toFixed(1) + "%, ACC=" + acc.toFixed(1) + "%. Need ≥70% both to unlock next level.", 'info');
                }
            };

            var handlePlaybackComplete = function() {
                var player = getSelectedPlayer();
                if (!player) { showToast("No player selected", 'error'); return Promise.resolve(null); }
                if (!reportData || !reportData.actions || reportData.actions.length === 0) {
                    showToast("No actions recorded", 'info');
                    return Promise.resolve(null);

                var goalsByScreen = {};
                analysisResults.forEach(function(a) {
                    if (a.result === 'Correct' && a.winning_screen && a.winning_screen !== 'N/A') {
                        var s = a.winning_screen;
                        goalsByScreen[s] = (goalsByScreen[s] || 0) + 1;
                    }
                });

                var directory = reportData.directory || currentDirectory || '';

                var sessionData = {
                    level: selectedLevel || 'Unknown',
                    subdirectory: selectedSubdirectory || '',
                    total_duration_minutes: 0,
                    video_count: 0,
                    directory: directory,
                    report_path: '',
                    statistics: {
                        correct: (reportData.statistics && reportData.statistics.correct) || 0,
                        late: (reportData.statistics && reportData.statistics.late) || 0,
                        wrong: (reportData.statistics && reportData.statistics.wrong) || 0,
                        miss: (reportData.statistics && reportData.statistics.miss) || 0,
                        avg_ae: (reportData.statistics && reportData.statistics.avg_ae) || 0
                    },
                    goals_by_screen: goalsByScreen,
                    actions: analysisResults.map(function(r) {
                        return {
                            block_id: r.id || '',
                            action: r.action || '',
                            screens: r.screens ? r.screens.split(', ') : [],
                            finishing_type: r.result === 'Correct' ? 'CORRECT' : r.result === 'Late' ?
                                'LATE' : r.result === 'Wrong' ? 'WRONG' : r.result === 'Miss' ?
                                'MISS' : 'WRONG',
                            goal_screen: r.winning_screen || 'N/A',
                            action_time: r.session_duration !== null ? r.session_duration : null,
                            aep: r.aep || '-',
                            ae: r.ae || 0,
                            video_index: r.video_index || 0
                        };
                    }),
                    total_actions: reportData.total_actions || 0,
                    avg_finishing_time: (reportData.statistics && reportData.statistics
                        .avg_finishing_time) || 0
                };

                return saveSessionToPlayerFolder(
                    player.id, player.name, player.surname, player.playerId, sessionData
                ).then(function() {
                    return loadPlayers().then(function() {
                        var updatedPlayer = getSelectedPlayer();
                        if (updatedPlayer) updateProgressForPlayer(updatedPlayer);
                        // After saving and reloading, check for auto-unlock
                        var stats = reportData.statistics || {};
                        var currentLevelId = selectedLevel; // the level just played
                        var subdir = selectedSubdirectory; // the subdirectory used
                        checkAndUnlockNextLevel(stats, currentLevelId, subdir);
                    });
                });
            };

            var startRealtimePlayback = function() {
                var player = getSelectedPlayer();
                if (!player) { setError("Please select a player first");
                    setTimeout(function() { setError(""); }, 3000); return; }
                if (!selectedLevel) { setError("Please select a training level");
                    setTimeout(function() { setError(""); }, 3000); return; }
                if (unlockedLevels.indexOf(selectedLevel) === -1) {
                    setError("This level is locked. Please select an unlocked level.");
                    setTimeout(function() { setError(""); }, 3000);
                    return;
                }

                // Check if subdirectory is required and selected
                var hasSubdirs = false;
                var isLockedSubdir = false;
                if (selectedLevel) {
                    var isFoundation = selectedLevel.toLowerCase().indexOf('foundation') !== -1 || selectedLevel === 'L00-Foundation';
                    if (isFoundation && LEVEL_SUBDIRS['L00-Foundation']) {
                        hasSubdirs = true;
                        // No subdirectories are locked
                    }
                }
                if (hasSubdirs && !selectedSubdirectory) {
                    setError("Please select a subdirectory for this level.");
                    setTimeout(function() { setError(""); }, 3000);
                    return;
                }

                setError("");
                setRealtimeRunning(true);
                setVisualizationEnabled(false);
                setActiveTab("main");
                sessionSavedRef.current = false;

                var payload = {
                    level: selectedLevel,
                    speed: 1.0,
                    player_id: player.id,
                    player_name: player.name,
                    player_surname: player.surname,
                    player_player_id: player.playerId
                };
                if (selectedSubdirectory) {
                    payload.subdirectory = selectedSubdirectory;
                }

                axios.post("/start-realtime-playback", payload).then(function() {
                    showToast("Realtime playback started for " + player.name + ' ' + player.surname +
                        (selectedSubdirectory ? ' [' + selectedSubdirectory + ']' : ''), 'success');

                    if (liveIntervalRef.current) clearInterval(liveIntervalRef.current);
                    if (realtimeMonitorInterval.current) clearTimeout(realtimeMonitorInterval.current);
                    if (autoStopTimeoutRef.current) clearTimeout(autoStopTimeoutRef.current);

                    liveIntervalRef.current = setInterval(function() { fetchRealtimeResults(false); },
                    800);

                    autoStopTimeoutRef.current = setTimeout(function() {
                        if (realtimeRunning && !sessionSavedRef.current) {
                            showToast("Auto‑stopping after 120s (safety timeout)", 'info');
                            stopPlayback();
                        }
                    }, 120000);

                    var checkStatus = function() {
                        if (sessionSavedRef.current) return;
                        axios.get("/playback-status").then(function(statusRes) {
                            if (!statusRes.data || !statusRes.data.state) {
                                sessionSavedRef.current = true;
                                setRealtimeRunning(false);
                                if (liveIntervalRef.current) { clearInterval(
                                        liveIntervalRef.current);
                                    liveIntervalRef.current = null; }
                                if (autoStopTimeoutRef.current) { clearTimeout(
                                        autoStopTimeoutRef.current);
                                    autoStopTimeoutRef.current = null; }
                                if (reportData && reportData.actions && reportData.actions
                                    .length) {
                                    showToast("Playback finished, saving session…", 'info');
                                    handlePlaybackComplete().then(function() {
                                        showToast("Session saved successfully!",
                                            'success');
                                    });
                                }
                                return;
                            }
                            var state = statusRes.data.state;
                            if (state === "completed" || state === "closed") {
                                sessionSavedRef.current = true;
                                setRealtimeRunning(false);
                                if (liveIntervalRef.current) { clearInterval(
                                        liveIntervalRef.current);
                                    liveIntervalRef.current = null; }
                                if (autoStopTimeoutRef.current) { clearTimeout(
                                        autoStopTimeoutRef.current);
                                    autoStopTimeoutRef.current = null; }
                                showToast("Playback finished, saving session…", 'info');
                                handlePlaybackComplete().then(function() {
                                    showToast("Session saved successfully!", 'success');
                                });
                                return;
                            } else if (state === "error") {
                                sessionSavedRef.current = true;
                                setRealtimeRunning(false);
                                if (liveIntervalRef.current) { clearInterval(
                                        liveIntervalRef.current);
                                    liveIntervalRef.current = null; }
                                if (autoStopTimeoutRef.current) { clearTimeout(
                                        autoStopTimeoutRef.current);
                                    autoStopTimeoutRef.current = null; }
                                setError("Playback error occurred");
                                return;
                            }
                            if (realtimeRunning && !sessionSavedRef.current) {
                                realtimeMonitorInterval.current = setTimeout(checkStatus,
                                2000);
                            }
                        }).catch(function(e) {
                            console.warn("Playback status check failed:", e);
                            sessionSavedRef.current = true;
                            setRealtimeRunning(false);
                            if (liveIntervalRef.current) { clearInterval(liveIntervalRef
                                    .current);
                                liveIntervalRef.current = null; }
                            if (autoStopTimeoutRef.current) { clearTimeout(
                                    autoStopTimeoutRef.current);
                                autoStopTimeoutRef.current = null; }
                            if (reportData && reportData.actions && reportData.actions
                                .length) {
                                showToast("Playback finished, saving session…", 'info');
                                handlePlaybackComplete().then(function() {
                                    showToast("Session saved successfully!", 'success');
                                });
                            }
                        });
                    };
                    realtimeMonitorInterval.current = setTimeout(checkStatus, 2000);
                }).catch(function(e) {
                    setError("Failed to start: " + (e.response ? e.response.data.detail : e.message));
                    setRealtimeRunning(false);
                });
            };

            var stopPlayback = function() {
                if (realtimeRunning && !sessionSavedRef.current && reportData && reportData.actions && reportData
                    .actions.length) {
                    showToast("Saving session before stopping…", 'info');
                    handlePlaybackComplete().then(function() {
                        sessionSavedRef.current = true;
                        showToast("Session saved", 'success');
                    });
                }
                if (realtimeRunning) {
                    axios.post("/stop-realtime").catch(function(e) { console.error(e); });
                }
                setRealtimeRunning(false);
                if (realtimeMonitorInterval.current) { clearTimeout(realtimeMonitorInterval.current);
                    realtimeMonitorInterval.current = null; }
                if (liveIntervalRef.current) { clearInterval(liveIntervalRef.current);
                    liveIntervalRef.current = null; }
                if (autoStopTimeoutRef.current) { clearTimeout(autoStopTimeoutRef.current);
                    autoStopTimeoutRef.current = null; }
                setVisualizationEnabled(false);
                showToast("Realtime stopped", 'info');
            };

            var displayResultsOnScreen2 = function() {
                showToast("Searching for results…", 'info');
                var directory = null;
                if (reportData && reportData.directory) {
                    directory = reportData.directory;
                } else if (currentDirectory) {
                    directory = currentDirectory;
                }
                if (!directory) {
                    axios.get("/results").then(function(res) {
                        if (res.data && res.data.directory) directory = res.data.directory;
                    }).catch(function() {});
                }
                if (directory) {
                    axios.post("/create-results-video", { directory: directory, video_index: 1 }).then(function(
                    res) {
                        if (res.data && res.data.status === "success") {
                            showToast("Results video created and displayed on Screen 2", 'success');
                            if (realtimeRunning) {
                                showToast("Auto-stopping playback after video generation", 'info');
                                stopPlayback();
                            }

                        }

            var forceRefreshReport = function() {

                    showToast("No directory loaded", 'error');

            // ----- EFFECTS -----
            useEffect(function() {
                fetchRealtimeResults(false);

                var live = setInterval(function() { if (realtimeRunning) fetchRealtimeResults(false); }, 800);
                return function() {
                    clearInterval(interval);
                    clearInterval(live);
                    if (realtimeMonitorInterval.current) clearTimeout(realtimeMonitorInterval.current);
                    if (autoStopTimeoutRef.current) clearTimeout(autoStopTimeoutRef.current);
                };

            useEffect(function() {

                    axios.post("/set-visualization", { enabled: val }).catch(function() {});
                } else {

                    localStorage.setItem('simust_visualization', JSON.stringify(false));
                    axios.post("/set-visualization", { enabled: false }).catch(function() {});
                }
                return function() {
                    if (realtimeMonitorInterval.current) clearTimeout(realtimeMonitorInterval.current);
                    if (autoStopTimeoutRef.current) clearTimeout(autoStopTimeoutRef.current);
                };
            }, []);

            useEffect(function() {
                var player = getSelectedPlayer();

                    updateProgressForPlayer(player);
                }

            useEffect(function() {

            // Reset subdirectory when level changes

            var closeMenu = function() { setMenuOpen(false); };

            // RENDER
            // =====================================================================

            if (!loggedIn) {
                return React.createElement(LoginScreen, {
                    onLogin: handleLogin,
                    error: loginError,
                    lang: lang,
                    onLangChange: changeLang,
                    t: t
                });
            }

            return React.createElement('div', { className: "simust-card" },
                // HEADER
                React.createElement('div', { className: "simust-header" },
                    React.createElement('div', { className: "flex items-center gap-4" },
                        React.createElement('div', { className: "hamburger-menu" },
                            React.createElement('button', { onClick: toggleMenu, className: "hamburger-btn" },
                                '☰'),
                            React.createElement('div', { className: "dropdown-menu" + (menuOpen ?
                                    ' open' : '') },
                                React.createElement('button', { onClick: function() { setActiveTab(
                                        'main');
                                        closeMenu(); } }, t('smartControl')),
                                isAdmin ? React.createElement('button', { onClick: function() {
                                        setActiveTab('results');
                                        closeMenu(); } }, t('results')) : null,
                                isAdmin ? React.createElement('button', { onClick: function() {
                                        setActiveTab('manage');
                                        closeMenu(); } }, t('managePlayers')) : null
                            )
                        ),
                        React.createElement('h1', { className: "text-3xl font-black" },
                            React.createElement('span', { className: "gold-accent" }, "SIMUST"),
                            React.createElement('span', { className: "text-white" }, " PLAY IT SMART")
                        )
                    ),
                    React.createElement('div', { className: "flex items-center gap-4" },
                        React.createElement(LanguageSwitcher, { lang: lang, onLangChange: changeLang }),
                        React.createElement('span', { className: "live-dot" + (realtimeRunning ?
                                ' active' : ' inactive') }),
                        React.createElement('span', { className: "text-xs text-gray-400" },
                            realtimeRunning ? t("live") : t("idle")
                        ),
                        React.createElement('button', { onClick: handleLogout, className: "btn-logout" },
                            t("logout"))
                    )
                ),

                // TABS
                React.createElement('div', { className: "flex gap-1 px-6 border-b border-[#ffc10720] overflow-x-auto" },
                    React.createElement('button', {
                        onClick: function() { setActiveTab('main'); },
                        className: "tab-button" + (activeTab === 'main' ? ' active' : '')
                    }, t("smartControl")),
                    isAdmin ?
                    React.createElement('button', {
                        onClick: function() { setActiveTab('results'); },
                        className: "tab-button" + (activeTab === 'results' ? ' active' : '')
                    }, t("results")) :
                    null,
                    isAdmin ?
                    React.createElement('button', {
                        onClick: function() { setActiveTab('manage'); },
                        className: "tab-button" + (activeTab === 'manage' ? ' active' : '')
                    }, t("managePlayers")) :
                    null
                ),

                // CONTENT
                React.createElement('div', { className: "p-6" },
                    activeTab === 'manage' && isAdmin ?
                    React.createElement(PlayerManagement, {
                        players: players,
                        onEdit: openEditModal,
                        onDelete: deletePlayer,
                        searchQuery: searchQuery,
                        setSearchQuery: setSearchQuery
                    }) :
                    activeTab === 'results' && isAdmin ?
                    React.createElement(React.Fragment, null,
                        React.createElement('div', { className: "flex justify-between items-center mb-4 flex-wrap gap-2" },
                            React.createElement('h2', { className: "text-2xl font-black gold-accent" },
                                "RESULTS – Summary & Training Details"),
                            React.createElement('div', { className: "flex items-center gap-2" },
                                React.createElement('button', { onClick: forceRefreshReport,
                                    className: "refresh-btn" }, "Refresh"),
                                lastUpdateTime ? React.createElement('span', { className: "text-xs text-gray-500" },
                                    "Last update: " + lastUpdateTime) : null
                            )
                        ),
                        loadingAnalysis ?
                        React.createElement('div', { className: "flex justify-center items-center py-20" },
                            React.createElement('div', { className: "loading-spinner" })
                        ) :
                        reportData && reportData.actions && reportData.actions.length ?
                        React.createElement(React.Fragment, null,
                            React.createElement(SummaryMetrics, { stats: reportData.statistics || {},
                                actions: analysisResults }),
                            React.createElement('div', { className: "mt-6" },
                                React.createElement('h3', { className: "gold-accent font-bold mb-3 text-sm" },
                                    "Training Details"),
                                React.createElement(ResultsTable, { actions: analysisResults })
                            )
                        ) :
                        React.createElement('div', { className: "text-center p-10 bg-[#0c1020] rounded-2xl border border-[#ffc10710]" },
                            React.createElement('p', { className: "text-gray-400" },
                                "No results yet. Start a training session."
                            )
                        )
                    ) :
                    // MAIN TAB
                    React.createElement(React.Fragment, null,
                        React.createElement(PlayerSelector, {
                            players: players,
                            selectedPlayerId: selectedPlayerId,
                            searchQuery: searchQuery,
                            showSearchResults: showSearchResults,
                            filteredPlayers: filteredPlayers,
                            showAddPlayer: showAddPlayer,
                            newPlayer: newPlayer,
                            loadingSessions: loadingSessions,
                            onSearch: performSearch,
                            onSelectPlayer: selectPlayerFromSearch,
                            onClearSelection: clearSelection,
                            onAddPlayer: addPlayerHandler,
                            onNewPlayerChange: setNewPlayer,
                            getSelectedPlayer: getSelectedPlayer,
                            allLevels: allLevels,
                            unlockedLevels: unlockedLevels,
                            completedLevels: completedLevels,
                            currentLevel: currentLevel,
                            isAdmin: isAdmin,
                            onUnlockLevel: handleUnlockLevel,
                            onLockLevel: handleLockLevel,
                            onLevelChange: function(level) {
                                setSelectedLevel(level);
                                setSelectedSubdirectory(""); // reset subdir when level changes
                            },
                            selectedLevel: selectedLevel,
                            selectedSubdirectory: selectedSubdirectory,
                            onSubdirectoryChange: setSelectedSubdirectory,
                            t: t
                        }),
                        getSelectedPlayer() ?
                        React.createElement(PlayerProfile, {
                            player: getSelectedPlayer(),
                            sessionCount: playerSessions.length,
                            simustScore: getSelectedPlayer().simustScore || 0,
                            isAdmin: isAdmin,
                            onEdit: openEditModal
                        }) :
                        null,
                        React.createElement('div', { className: "flex items-center gap-4 mb-4" },
                            React.createElement('span', { className: "text-white font-bold" },
                                t("visualization")),
                            React.createElement('label', { className: "toggle-switch" },
                                React.createElement('input', {
                                    type: "checkbox",
                                    checked: visualizationEnabled,
                                    onChange: function(e) { toggleVisualization(e.target
                                            .checked); }
                                }),
                                React.createElement('span', { className: "slider" })
                            ),
                            React.createElement('span', { className: "text-sm" + (visualizationEnabled ?
                                    ' viz-status-on' : ' text-gray-400') },
                                visualizationEnabled ? 'ON' : 'OFF'
                            )
                        ),
                        React.createElement('div', { className: "flex flex-wrap gap-4 items-center mb-6" },
                            React.createElement('button', {
                                onClick: startRealtimePlayback,
                                disabled: !selectedPlayerId || !selectedLevel || realtimeRunning ||
                                    unlockedLevels.indexOf(selectedLevel) === -1 ||
                                    (function() {
                                        if (!selectedLevel) return false;
                                        var isFoundation = selectedLevel.toLowerCase().indexOf('foundation') !== -1 || selectedLevel === 'L00-Foundation';
                                        if (isFoundation && LEVEL_SUBDIRS['L00-Foundation'] && LEVEL_SUBDIRS['L00-Foundation'].length > 0) {
                                            if (!selectedSubdirectory) return true;
                                            // No subdirectories are locked
                                            return false;
                                        }
                                        return false;
                                    })(),
                                className: "btn-primary btn-realtime px-6 py-2 rounded-full font-bold" +
                                    (!selectedPlayerId || !selectedLevel || realtimeRunning ||
                                        unlockedLevels.indexOf(selectedLevel) === -1 ||
                                        (function() {
                                            if (!selectedLevel) return true;
                                            var isFoundation = selectedLevel.toLowerCase().indexOf('foundation') !== -1 || selectedLevel === 'L00-Foundation';
                                            if (isFoundation && LEVEL_SUBDIRS['L00-Foundation'] && LEVEL_SUBDIRS['L00-Foundation'].length > 0) {
                                                if (!selectedSubdirectory) return true;
                                                // No locked subdirs
                                                return false;
                                            }
                                            return false;
                                        })() ?
                                        ' opacity-50' : '')
                            },
                                realtimeRunning ? t("playing") : t("realtimePlay"),
                                !realtimeRunning ? React.createElement('span', { className: "auto-badge" },
                                    "AUTO") : null
                            ),
                            realtimeRunning ?
                            React.createElement('button', {
                                onClick: stopPlayback,
                                className: "btn-primary btn-danger px-6 py-2 rounded-full font-bold"
                            }, t("stop")) :
                            null,
                            React.createElement('button', {
                                onClick: displayResultsOnScreen2,
                                className: "btn-primary btn-results px-6 py-2 rounded-full font-bold",
                                disabled: !reportData || !reportData.actions || reportData.actions
                                    .length === 0
                            }, t("showResults"))
                        ),
                        savingSession ?
                        React.createElement('div', { className: "mb-4 p-2 bg-blue-600/20 rounded-xl text-center" },
                            React.createElement('p', { className: "text-blue-300 text-sm" },
                                "Saving session…")
                        ) :
                        null,
                        error ?
                        React.createElement('div', { className: "mb-6 p-3 bg-red-900/50 rounded-xl" },
                            React.createElement('p', { className: "text-red-300" }, error)
                        ) :
                        null,
                        React.createElement('div', { className: "flex justify-center my-4" },
                            React.createElement('img', {
                                src: "/arena.png",
                                alt: "Arena",
                                className: "arena-image max-h-[280px] object-contain",
                                onError: function(e) { e.target.style.display = 'none'; }
                            })
                        )
                    )
                ),
                React.createElement('div', { className: "text-center text-[10px] text-gray-600 border-t border-[#ffc10720] py-4" },
                    t("allRights") + "  •  " + username
                ),
                toastMessage ? React.createElement('div', { className: "toast" }, toastMessage.message) : null,

                // Edit Modal
                editModalOpen ?
                React.createElement('div', { className: "modal-overlay" },
                    React.createElement('div', { className: "modal-box" },
                        React.createElement('h2', null, "Edit Player"),
                        React.createElement('div', { className: "form-group" },
                            React.createElement('label', null, "First Name"),
                            React.createElement('input', { value: editForm.name || '', onChange: function(

                                        .value })); } })
                        ),
                        React.createElement('div', { className: "form-group" },
                            React.createElement('label', null, "Last Name"),
                            React.createElement('input', { value: editForm.surname || '', onChange: function(
                                    e) { setEditForm(Object.assign({}, editForm, { surname: e.target
                                        .value })); } })
                        ),
                        React.createElement('div', { className: "form-group" },
                            React.createElement('label', null, "SIMUST ID"),
                            React.createElement('input', { value: editForm.playerId || '', onChange: function(
                                    e) { setEditForm(Object.assign({}, editForm, { playerId: e.target
                                        .value })); } })
                        ),
                        React.createElement('div', { className: "form-group" },
                            React.createElement('label', null, "Club"),
                            React.createElement('input', { value: editForm.club || '', onChange: function(
                                    e) { setEditForm(Object.assign({}, editForm, { club: e.target
                                        .value })); } })
                        ),
                        React.createElement('div', { className: "form-group" },
                            React.createElement('label', null, "Birthday"),
                            React.createElement('input', { type: "date", value: editForm.birthday || '',
                                onChange: function(e) {
                                    var val = e.target.value;
                                    var age = val ? (new Date().getFullYear() - new Date(val)
                                        .getFullYear()) : '';
                                    setEditForm(Object.assign({}, editForm, { birthday: val,
                                        age: age }));
                                } })
                        ),
                        React.createElement('div', { className: "form-group" },
                            React.createElement('label', null, "Age"),
                            React.createElement('input', { type: "number", value: editForm.age || '',
                                onChange: function(e) { setEditForm(Object.assign({}, editForm, { age: e
                                            .target.value })); } })
                        ),
                        React.createElement('div', { className: "form-group" },
                            React.createElement('label', null, "Image URL (or base64)"),
                            React.createElement('input', { value: editForm.image || '', onChange: function(
                                    e) { setEditForm(Object.assign({}, editForm, { image: e.target
                                        .value })); } })
                        ),
                        React.createElement('div', { className: "btn-row" },
                            React.createElement('button', { onClick: closeEditModal, className: "cancel-btn" },
                                "Cancel"),
                            React.createElement('button', { onClick: function() {
                                    if (window.confirm("Delete " + editForm.name + " " + editForm
                                        .surname + "?")) {
                                        deletePlayer(editForm.id);
                                        closeEditModal();
                                    }
                                }, className: "delete-btn" }, "Delete"),
                            React.createElement('button', { onClick: saveEdit, className: "save-btn" },
                                "Save")
                        )
                    )
                ) :
                null
            );
        }

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
